[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nvitop-cluster"
version = "0.1.0"
description = "Multi-node GPU monitor from MPI hostfile (nvitop-style bars + processes)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "wuqingliu" }]
keywords = ["gpu", "nvidia", "nvitop", "cluster", "mpi", "monitoring"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
nvitop = ["nvitop>=1.3"]

[project.scripts]
nvitop-cluster = "nvitop_cluster.nvitop_cluster:main"

[project.urls]
Homepage = "https://github.com/Micuks/nvitop-cluster"
Repository = "https://github.com/Micuks/nvitop-cluster"

[tool.setuptools]
packages = ["nvitop_cluster"]
